<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery-practice</title>
    <script src="jquery-4.0.0.min.js"></script>

    <style>
        #panel,#flip{
            padding: 5px;
            text-align: center;
            background-color: #c3c3c3;
        }

        #panel{
            padding: 50px;
            display: none;
        }


    </style>
</head>
<body>

<button id="hidebtn">hide</button>
<button id="showbtn">show</button>
<p id="text">hello world</p>

<script>
    $(document).ready(function(){
        $("#hidebtn").click(function(){
            $("#text").hide();
        });
        $("#showbtn").click(function(){
            $("#text").show();
        });
    });
</script>

<br>

<!-- fade in fade out -->

<div id="div1" style="width: 80px; height: 80px; background-color: yellow; display: none;"></div>
<div id="div2" style="width: 80px; height: 80px; background-color: rgb(253, 78, 2); display: none;"></div>
<div id="div3" style="width: 80px; height: 80px; background-color: rgb(197, 6, 255); display: none; "></div>

<button id="fadein">fadein</button> <br><br>

<button id="fadeoutbtn">fade out</button>

        <div id="div1" style="width: 80px; height: 80px; display: none; background-color: black;"></div>
        <div id="div2" style="width: 80px; height: 80px; display: none; background-color: rgb(55, 233, 10);"></div>
        <div id="div3" style="width: 80px; height: 80px; display: none; background-color: rgb(132, 0, 255);"></div>



<script>

    $(document).ready(function(){
        $("#fadein").click(function(){
            $("#div1").fadeIn()
            $("#div2").fadeIn("slow")
            $("#div3").fadeIn(4000)

            $("#fadeoutbtn").click(function(){
                    $("#div1").fadeOut()
                    $("#div2").fadeOut("slow")
                    $("#div3").fadeOut(4000)
                })
                })

          })

</script>
<br><br><br>


<!-- in out toggle -->

<div id="toggle1" style="background-color: pink; width: 80px; height: 80px; display: none;"></div>
<div id="toggle2" style="background-color: rgb(118, 27, 42); width: 80px; height: 80px; display: none;"></div>
<div id="toggle3" style="background-color: rgb(234, 11, 137); width: 80px; height: 80px; display: none;"></div>

<button id="togglebtn">toggle</button>

<script>
    $(document).ready(function(){
        $("#togglebtn").dblclick(function(){
            $("#toggle1").toggle()
            $("#toggle2").toggle("slow")
            $("#toggle3").toggle(4000)
        })
    })
</script>
<br><br>

<!-- slideup -->
 <div id="flip">click to slide down panel</div>
 <div id="panel">Hello World!</div>

 <script>
    $(document).ready(function(){
        $("#flip").click(function(){
            $("#panel").slideDown("slow")
        })
    })
 </script>



</body>
</html>
